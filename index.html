<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sign in Test Case</title>
	<style>
		* { box-sizing: border-box; }
		body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f4f5fa; color: #20243a; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
		.login { width: min(100%, 410px); padding: 40px; border: 1px solid #e8e9f0; border-radius: 18px; background: #fff; box-shadow: 0 20px 60px #29345b14; }
		.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 34px; font-size: 15px; font-weight: 700; }
		.brand-icon { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 10px; color: #fff; background: #6558d9; }
		h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -1px; }
		.subtitle { margin: 0 0 28px; color: #747b8e; font-size: 14px; }
		.field { margin-bottom: 18px; }
		label { display: block; margin-bottom: 8px; color: #3c4357; font-size: 13px; font-weight: 600; }
		input[type="email"], input[type="password"], input[type="text"] { width: 100%; height: 46px; padding: 0 13px; border: 1px solid #dfe1e9; border-radius: 8px; outline: none; font: inherit; font-size: 14px; }
		input:focus { border-color: #6558d9; box-shadow: 0 0 0 3px #6558d91c; }
		.password { position: relative; }
		.password input { padding-right: 60px; }
		.toggle { position: absolute; top: 50%; right: 12px; transform: translateY(-50%); padding: 4px; border: 0; background: none; color: #6558d9; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; }
		.options { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 2px 0 23px; font-size: 12px; }
		.remember { display: inline-flex; align-items: center; gap: 7px; margin: 0; color: #747b8e; font-weight: 400; }
		.remember input { accent-color: #6558d9; }
		a { color: #5b50ca; font-weight: 600; text-decoration: none; }
		a:hover { text-decoration: underline; }
		.submit { width: 100%; height: 46px; border: 0; border-radius: 8px; background: #6558d9; color: white; cursor: pointer; font: inherit; font-size: 14px; font-weight: 700; }
		.submit:hover { background: #5549c3; }
		.signup { margin: 24px 0 0; color: #747b8e; text-align: center; font-size: 13px; }
		@media (max-width: 460px) { .login { padding: 30px 24px; } }
	</style>
</head>
<body>
	<main class="login">
		<div class="brand"><span class="brand-icon" aria-hidden="true">N</span><span>Northstar</span></div>
		<h1>Welcome back</h1>
		<p class="subtitle">Sign in to continue to your account.</p>
		<form action="#" method="post">
			<div class="field">
				<label for="email">Email address</label>
				<input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
			</div>
			<div class="field">
				<label for="password">Password</label>
				<div class="password">
					<input id="password" name="password" type="text" placeholder="Enter your password" autocomplete="current-password" required>
					<button class="toggle" type="button" aria-controls="password" aria-pressed="false">Show</button>
				</div>
			</div>
			<div class="options">
				<label class="remember"><input type="checkbox" name="remember"> Remember me</label>
				<a href="#forgot-password">Forgot password?</a>
			</div>
			<button class="submit" type="submit">Sign in</button>
		</form>
		<p class="signup">New here? <a href="#create-account">Create an account</a></p>
	</main>
	<script>
		const password = document.querySelector('#password');
		const toggle = document.querySelector('.toggle');
		toggle.addEventListener('click', () => {
			const visible = password.type === 'password';
			password.type = visible ? 'text' : 'password';
			toggle.textContent = visible ? 'Hide' : 'Show';
			toggle.setAttribute('aria-pressed', String(visible));
		});
	</script>
</body>
</html>
